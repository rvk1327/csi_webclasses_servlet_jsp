<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="register_form" method="get" action="reqandres">
    <table>
        <tr>
            <td>User Name</td>
            <td><input type="text" name="txtusr"/></td>
        </tr>

        <tr>
            <td>Password</td>
            <td><input  type="password" name="txtpass"/></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td><input type="radio" name="gender" value="male"/> Male 
            <input type="radio" name="gender" value="female"/> Female</td>
        </tr>
        <tr>
            <td>Technologies</td>
            <td>
                <input type="checkbox" name="tech" value="core_java"/> Core Java
                <input type="checkbox" name="tech" value="spring"/> Spring
                <input type="checkbox" name="tech" value="hibernate"/> Hibernate
                <input type="checkbox" name="tech" value="reactjs"/> React JS
            </td>
        </tr>

        <tr>
            <td>Country</td>
            <td>
                <select name="ctry">
                    <option>Select</option>
                    <option>India</option>
                    <option>Russia</option>
                    <option>Australia</option>
                    <option>America</option>
                    <option>Germany</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Email  ID</td>
            <td><input type="email" name="txtemail"/></td>
        </tr>
        
        <tr>
            <td><input type="submit" value="Register"/></td>
            <td><input type="reset" value="Cancel"/></td>
        </tr>
    </table>
    </form>
</body>
</html>
